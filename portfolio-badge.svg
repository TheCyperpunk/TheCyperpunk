<svg xmlns="http://www.w3.org/2000/svg" width="130" height="28" viewBox="0 0 130 28" role="img" aria-label="Portfolio">
  <!-- Dark label section -->
  <rect width="36" height="28" fill="#065f46"/>
  <!-- Bright value section -->
  <rect x="36" width="94" height="28" fill="#10B981"/>
  <!-- Briefcase icon -->
  <g transform="translate(10 7)">
    <rect x="1" y="4" width="13" height="9" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
    <rect x="5" y="2" width="5" height="3" fill="#FFFFFF"/>
    <line x1="7.5" y1="8" x2="7.5" y2="11" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
  <!-- Text: PORTFOLIO -->
  <text x="83" y="18" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">PORTFOLIO</text>
</svg>
